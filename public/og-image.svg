<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Sarosh Qaiser — AI Engineer</title>
  <desc id="desc">A light spatial portfolio preview for an AI Engineer building agentic AI, RAG, machine learning and full-stack products.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8faf6"/><stop offset=".52" stop-color="#edf3ee"/><stop offset="1" stop-color="#f3f2ef"/>
    </linearGradient>
    <radialGradient id="mint" cx="0" cy="0" r="1" gradientTransform="translate(205 70) rotate(42) scale(690 520)">
      <stop stop-color="#c4ded1" stop-opacity=".9"/><stop offset="1" stop-color="#c4ded1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lavender" cx="0" cy="0" r="1" gradientTransform="translate(1030 95) rotate(132) scale(560 430)">
      <stop stop-color="#d7d9ef" stop-opacity=".7"/><stop offset="1" stop-color="#d7d9ef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff" stop-opacity=".92"/><stop offset="1" stop-color="#fff" stop-opacity=".48"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#83ad9a"/><stop offset="1" stop-color="#476f61"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="16"/>
      <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#canvas)"/>
  <rect width="1200" height="630" fill="url(#mint)"/>
  <rect width="1200" height="630" fill="url(#lavender)"/>
  <g opacity=".22" fill="none" stroke="#789889">
    <circle cx="975" cy="300" r="250"/><circle cx="975" cy="300" r="205"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="820" y="92" width="298" height="410" rx="42" fill="url(#glass)" stroke="#fff" stroke-width="3"/>
    <rect x="844" y="116" width="250" height="362" rx="30" fill="#eff4ef" stroke="#d9e5dc" stroke-width="2"/>
  </g>
  <circle cx="969" cy="271" r="97" fill="none" stroke="#6d9783" stroke-width="3"/>
  <circle cx="969" cy="271" r="72" fill="none" stroke="#cdddcf" stroke-width="2"/>
  <text x="969" y="289" text-anchor="middle" fill="#4b7563" font-family="Arial,Helvetica,sans-serif" font-size="47" font-weight="700">SQ</text>
  <rect x="890" y="398" width="158" height="42" rx="21" fill="#e2ece5" stroke="#fff" stroke-width="2"/>
  <text x="969" y="424" text-anchor="middle" fill="#687d73" font-family="monospace" font-size="11" letter-spacing="1.2">SPATIAL UI</text>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="80" y="100" fill="#687d73" font-size="15" letter-spacing="2.3">AI ENGINEER  /  LAHORE, PAKISTAN</text>
    <text x="76" y="266" fill="#1e2f29" font-size="66" font-weight="700" letter-spacing="-2.5">SAROSH QAISER</text>
    <rect x="80" y="283" width="260" height="8" rx="4" fill="url(#accent)"/>
    <text x="80" y="367" fill="#4b7563" font-size="32" font-weight="700">Building thoughtful AI products.</text>
    <text x="80" y="416" fill="#687d73" font-size="20">Agentic AI  ·  RAG  ·  Machine Learning  ·  Full-stack</text>
    <text x="80" y="455" fill="#829187" font-size="15">Python  /  LangGraph  /  React  /  ML</text>
  </g>
  <path d="M80 530H1120" stroke="#b8ccbf" stroke-opacity=".8"/>
  <text x="80" y="561" fill="#687d73" font-family="monospace" font-size="12" letter-spacing="1">NOVA  /  PERSONAL AI  /  MULTI-AGENT SYSTEMS</text>
  <text x="960" y="561" fill="#687d73" font-family="monospace" font-size="12" letter-spacing="1">SAROSH548</text>
</svg>