<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Sarosh Qaiser — AI Engineer</title>
  <desc id="desc">A light spatial portfolio preview for an AI Engineer building agentic AI, RAG, machine learning and full-stack products.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8faf6"/><stop offset=".52" stop-color="#edf3ee"/><stop offset="1" stop-color="#f3f2ef"/>
    </linearGradient>
    <radialGradient id="mint" cx="0" cy="0" r="1" gradientTransform="translate(205 70) rotate(42) scale(690 520)">
      <stop stop-color="#c4ded1" stop-opacity=".9"/><stop offset="1" stop-color="#c4ded1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lavender" cx="0" cy="0" r="1" gradientTransform="translate(1030 95) rotate(132) scale(560 430)">
      <stop stop-color="#d7d9ef" stop-opacity=".7"/><stop offset="1" stop-color="#d7d9ef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff" stop-opacity=".92"/><stop offset="1" stop-color="#fff" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#83ad9a"/><stop offset="1" stop-color="#476f61"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="16"/>
      <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#canvas)"/>
  <rect width="1200" height="630" fill="url(#mint)"/>
  <rect width="1200" height="630" fill="url(#lavender)"/>
  <circle cx="1000" cy="305" r="245" fill="none" stroke="#8eaa9b" stroke-opacity=".23" stroke-width="2"/>
  <circle cx="1000" cy="305" r="194" fill="none" stroke="#fff" stroke-opacity=".88" stroke-width="2"/>
  <circle cx="1000" cy="305" r="143" fill="none" stroke="#9ab5a6" stroke-opacity=".2" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="775" y="110" width="310" height="360" rx="42" fill="url(#glass)" stroke="#fff" stroke-width="3"/>
    <rect x="804" y="137" width="252" height="307" rx="30" fill="#e7eee8" stroke="#fff" stroke-width="8"/>
    <rect x="827" y="472" width="300" height="88" rx="24" fill="url(#glass)" stroke="#fff" stroke-width="2"/>
  </g>
  <g fill="#253a32" font-family="Arial, Helvetica, sans-serif">
    <text x="78" y="103" font-size="16" letter-spacing="3" fill="#617a6e">AI ENGINEER  /  LAHORE, PAKISTAN</text>
    <text x="76" y="264" font-size="82" font-weight="700" letter-spacing="-4">SAROSH QAISER</text>
    <rect x="80" y="292" width="260" height="6" rx="3" fill="url(#accent)"/>
    <text x="78" y="375" font-size="35" font-weight="700" fill="#456e60">Building thoughtful AI products.</text>
    <text x="78" y="422" font-size="20" fill="#6d7e75">Agentic AI  ·  RAG  ·  Machine Learning  ·  Full-stack</text>
    <text x="78" y="552" font-size="16" letter-spacing="1.5" fill="#71877a">NOVA  /  PERSONAL AI  /  MULTI-AGENT SYSTEMS</text>
    <text x="915" y="525" font-size="15" font-weight="700" letter-spacing="2" fill="#456e60">SPATIAL PORTFOLIO</text>
  </g>
  <rect x="78" y="485" width="580" height="1" fill="#9fb6a8" opacity=".5"/>
  <g fill="url(#accent)">
    <circle cx="1112" cy="143" r="13"/><circle cx="755" cy="441" r="9"/>
  </g>
</svg>
